<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="Значение 1/2 даёт хэш, по хэшу выбирается одна корзина, и Equals вызывается только с элементами этой корзины"><defs><marker id="hs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"></marker></defs>
<g style="color:#59636f">
<rect x="10" y="80" width="90" height="40" rx="5" fill="#ffffff" stroke="#8a919b"/><text x="55" y="105" text-anchor="middle" font-size="13" class="mono" style="fill:#59636f">1/2</text>
<line x1="102" y1="100" x2="146" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#hs)"/>
<text x="124" y="90" text-anchor="middle" font-size="11">хэш</text>
<rect x="150" y="80" width="150" height="40" rx="5" fill="#e7eef9" stroke="#24549b"/><text x="225" y="98" text-anchor="middle" font-size="12" class="mono" style="fill:#59636f">GetHashCode()</text><text x="225" y="113" text-anchor="middle" font-size="11" class="mono" style="fill:#59636f">= 1046, 1046 % 4 = 2</text>
<line x1="302" y1="100" x2="368" y2="128" stroke="#24549b" stroke-width="1.6" marker-end="url(#hs)" style="color:#24549b"/>
<text x="400" y="22" font-size="12" font-weight="700">корзины</text>
<rect x="372" y="32" width="40" height="34" rx="3" fill="#ffffff" stroke="#8a919b"/><text x="392" y="54" text-anchor="middle" font-size="12">0</text><rect x="420" y="32" width="200" height="34" rx="3" fill="#ffffff" stroke="#59636f"/><text x="432" y="54" font-size="12" class="mono" style="fill:#59636f">3/4</text>
<rect x="372" y="72" width="40" height="34" rx="3" fill="#ffffff" stroke="#8a919b"/><text x="392" y="94" text-anchor="middle" font-size="12">1</text><rect x="420" y="72" width="200" height="34" rx="3" fill="#ffffff" stroke="#59636f"/>
<rect x="372" y="112" width="40" height="34" rx="3" fill="#e7eef9" stroke="#24549b"/><text x="392" y="134" text-anchor="middle" font-size="12" style="fill:#59636f">2</text><rect x="420" y="112" width="200" height="34" rx="3" fill="#e7eef9" stroke="#24549b"/><text x="432" y="134" font-size="12" class="mono" style="fill:#59636f">5/7   1/2</text>
<rect x="372" y="152" width="40" height="34" rx="3" fill="#ffffff" stroke="#8a919b"/><text x="392" y="174" text-anchor="middle" font-size="12">3</text><rect x="420" y="152" width="200" height="34" rx="3" fill="#ffffff" stroke="#59636f"/><text x="432" y="174" font-size="12" class="mono" style="fill:#59636f">-1/3   8/5</text>
<text x="496" y="203" text-anchor="middle" font-size="11">Equals — только внутри корзины 2</text>
</g></svg>