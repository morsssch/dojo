<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Стек вызовов: Main вызвал Level1, тот Level2, тот Level3; исключение из Level3 поднимается вниз по кадрам до кадра с подходящим catch"><defs><marker id="cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"></marker></defs><g style="color:#59636f"><text x="160" y="20" text-anchor="middle" font-size="13" font-weight="700">Стек вызовов (растёт вверх)</text><rect x="40" y="30" width="240" height="40" rx="4" fill="#59636f" stroke="#a53a3a"/><text x="56" y="55" font-size="13" class="mono">Level3()   throw …</text><rect x="40" y="76" width="240" height="40" rx="4" fill="#ffffff" stroke="#8a919b"/><text x="56" y="101" font-size="13" class="mono">Level2()   нет try</text><rect x="40" y="122" width="240" height="40" rx="4" fill="#59636f" stroke="#59636f"/><text x="56" y="147" font-size="13" class="mono">Level1()   try/catch</text><rect x="40" y="168" width="240" height="40" rx="4" fill="#ffffff" stroke="#8a919b"/><text x="56" y="193" font-size="13" class="mono">Main()</text><path d="M290,50 C360,60 360,130 292,140" fill="none" stroke="#a53a3a" stroke-width="1.8" marker-end="url(#cs)" style="color:#a53a3a"/><text x="372" y="84" font-size="12" style="fill:#a53a3a">исключение ищет</text><text x="372" y="100" font-size="12" style="fill:#a53a3a">ближайший try с подходящим</text><text x="372" y="116" font-size="12" style="fill:#a53a3a">catch, снимая кадры</text><text x="372" y="150" font-size="12" style="fill:#59636f">пойман здесь: Level1 продолжает</text><text x="372" y="188" font-size="12" class="muted">если не нашёлся — системный try,</text><text x="372" y="204" font-size="12" class="muted">программа завершается</text></g></svg>