<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Структура хранит поля прямо в переменной, и присваивание копирует их; класс хранит в переменной ссылку, и присваивание копирует ссылку"><defs><marker id="sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"></marker></defs>
<g style="color:#59636f"><text x="150" y="20" text-anchor="middle" font-size="13" font-weight="700">struct PointS: поля внутри переменной</text><text x="460" y="20" text-anchor="middle" font-size="13" font-weight="700">class PointC: в переменной ссылка</text>
<rect x="20" y="40" width="120" height="60" rx="4" fill="#ffffff" stroke="#8a919b"/><text x="30" y="58" font-size="12" class="mono">s1</text><text x="30" y="78" font-size="12" class="mono">X=1 Y=2</text>
<rect x="160" y="40" width="120" height="60" rx="4" fill="#ffffff" stroke="#8a919b"/><text x="170" y="58" font-size="12" class="mono">s2 (копия)</text><text x="170" y="78" font-size="12" class="mono" style="fill:#a53a3a">X=100 Y=2</text>
<text x="150" y="125" text-anchor="middle" font-size="11" class="muted">s2 = s1 скопировало оба поля;</text><text x="150" y="141" text-anchor="middle" font-size="11" class="muted">s2.X = 100 не трогает s1</text>
<rect x="330" y="40" width="90" height="34" rx="4" fill="#ffffff" stroke="#24549b"/><text x="340" y="62" font-size="12" class="mono">c1</text><circle cx="408" cy="57" r="4" fill="#24549b"/>
<rect x="330" y="86" width="90" height="34" rx="4" fill="#ffffff" stroke="#24549b"/><text x="340" y="108" font-size="12" class="mono">c2</text><circle cx="408" cy="103" r="4" fill="#24549b"/>
<rect x="480" y="60" width="120" height="50" rx="6" fill="#e7eef9" stroke="#24549b"/><text x="492" y="80" font-size="12" class="mono">объект в куче</text><text x="492" y="99" font-size="12" class="mono" style="fill:#a53a3a">X=100 Y=2</text>
<path d="M412,57 C445,57 450,72 476,76" fill="none" stroke="#24549b" stroke-width="1.6" marker-end="url(#sc)" style="color:#24549b"/><path d="M412,103 C445,103 450,92 476,90" fill="none" stroke="#24549b" stroke-width="1.6" marker-end="url(#sc)" style="color:#24549b"/>
<text x="465" y="150" text-anchor="middle" font-size="11" class="muted">c2 = c1 скопировало ссылку:</text><text x="465" y="166" text-anchor="middle" font-size="11" class="muted">объект один, изменение видно через обе</text></g></svg>