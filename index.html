<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dojo</title>
    <meta name="description" content="Интерактивные курсы: теория порциями, задачи на Go, SQL и Git прямо в браузере." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23182544'/><rect x='4' y='14' width='24' height='5' rx='1.5' fill='%23f3b33d'/><path d='M14 19l-3 8M18 19l3 8' stroke='%23f3b33d' stroke-width='3' stroke-linecap='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- шрифты грузятся без блокировки отрисовки: если Google Fonts недоступен, страница всё равно появится -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('dojo:progress:v1') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
