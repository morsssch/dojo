title: Go Backend с нуля
subtitle: От «ни разу не писал бэк» до своего хакатон-стартера на Go — к весеннему хакатону.
icon: 🐹
order: 1
description: |
  Курс для тех, кто никогда не писал бэкенд и хочет освоить его с нуля.
  Теория маленькими порциями, после каждого куска — вопрос, после каждой темы — задачи прямо в браузере:
  Go, SQL на настоящем Postgres и git с терминалом. Сквозной проект — свой **хакатон-стартер**,
  а поверх него — продукт, как на настоящем хакатоне.

  Курс в процессе наполнения: модули с пометкой «скоро» ещё пишутся.
