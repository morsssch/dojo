title: Витрина Dojo
subtitle: Все компоненты платформы на живых примерах. Курс для ревью и шпаргалка для авторов.
icon: 🧪
order: 2
description: |
  Здесь показан каждый тип блока, который поддерживает платформа: теория с выносками и схемами,
  квизы пяти видов, задачи на Go/SQL/JS/Python с автопроверкой, git-терминал, анимированные схемы
  и задания «на своём компьютере». Исходники уроков лежат в `courses/demo/` — открывай рядом с
  `docs/AUTHORING.md`, чтобы увидеть, как это написано.
